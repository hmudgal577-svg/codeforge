# ============================================
# GitHub Actions — CD Pipeline (Production)
# ============================================
name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags
        run: |
          cd k8s/base
          sed -i "s|codeforge/api-gateway:latest|ghcr.io/${{ github.repository }}/api-gateway:${{ github.sha }}|g" deployments.yml
          sed -i "s|codeforge/web:latest|ghcr.io/${{ github.repository }}/web:${{ github.sha }}|g" deployments.yml

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/base/secrets.yml
          kubectl apply -f k8s/base/deployments.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway -n codeforge --timeout=300s
          kubectl rollout status deployment/web -n codeforge --timeout=300s

      - name: Verify deployment
        run: kubectl get pods -n codeforge
