# Alert Rules
groups:
  - name: codeforge-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency > 2s"

      - alert: ExecutionQueueBacklog
        expr: bullmq_queue_waiting > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Execution queue backlog > 50 jobs"
