global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'codeforge-api-gateway'
    static_configs:
      - targets: ['api-gateway:4000']
    metrics_path: '/api/v1/metrics'

  - job_name: 'codeforge-execution-workers'
    static_configs:
      - targets: ['execution-worker-1:3001', 'execution-worker-2:3002']
    metrics_path: '/metrics'

  - job_name: 'codeforge-orchestrator'
    static_configs:
      - targets: ['execution-orchestrator:3010']
    metrics_path: '/metrics'

  - job_name: 'codeforge-ai-worker'
    static_configs:
      - targets: ['ai-worker:3020']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
