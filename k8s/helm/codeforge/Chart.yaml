apiVersion: v2
name: codeforge
description: CodeForge Cloud IDE — Production Kubernetes Deployment
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
